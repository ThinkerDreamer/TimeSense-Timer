<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>TimeSense Timer</title>
  </head>

  <body>
    <main class="app" data-status="idle">
      <header class="top">
        <h1 class="title">TimeSense Timer</h1>
        <button
          type="button"
          class="popout"
          title="Pop out timer"
          aria-label="Pop out timer"
        >
          <svg viewBox="0 0 512 512" aria-hidden="true">
            <path
              fill="currentColor"
              d="M352 0c-12.9 0-24.6 7.8-29.6 19.8s-2.2 25.7 6.9 34.9L370.7 96 201.4 265.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L416 141.3l41.4 41.4c9.2 9.2 22.9 11.9 34.9 6.9s19.8-16.6 19.8-29.6l0-128c0-17.7-14.3-32-32-32L352 0zM80 32C35.8 32 0 67.8 0 112L0 432c0 44.2 35.8 80 80 80l320 0c44.2 0 80-35.8 80-80l0-112c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 112c0 8.8-7.2 16-16 16L80 448c-8.8 0-16-7.2-16-16l0-320c0-8.8 7.2-16 16-16l112 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L80 32z"
            />
          </svg>
        </button>
      </header>

      <div class="ring-area">
        <div class="ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path
              class="ring-trail"
              d="M 50,5 a 45,45 0 0,1 0,90 a 45,45 0 0,1 0,-90"
            />
            <path
              class="ring-remaining"
              pathLength="1"
              d="M 50,5 a 45,45 0 0,1 0,90 a 45,45 0 0,1 0,-90"
            />
          </svg>
          <div class="label" role="timer" aria-live="off"></div>
        </div>
      </div>

      <form class="controls">
        <div class="inputs">
          <label class="visually-hidden" for="hours">Hours</label>
          <input
            id="hours"
            type="number"
            inputmode="numeric"
            min="0"
            max="23"
            placeholder="h"
          />
          <span>:</span>
          <label class="visually-hidden" for="minutes">Minutes</label>
          <input
            id="minutes"
            type="number"
            inputmode="numeric"
            min="0"
            max="59"
            placeholder="m"
          />
          <span>:</span>
          <label class="visually-hidden" for="seconds">Seconds</label>
          <input
            id="seconds"
            type="number"
            inputmode="numeric"
            min="0"
            max="59"
            placeholder="s"
          />
        </div>
        <div class="buttons">
          <button type="submit" class="start">Start</button>
          <button type="button" class="pause">Pause</button>
          <button type="button" class="resume">Resume</button>
          <button type="button" class="reset">Reset</button>
        </div>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
